<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logis237 – Trouve ta maison au Cameroun</title>

</head>
<body>
<div id="app"></div>
<script>window.onerror=function(m,s,l){document.getElementById("app").innerHTML='<p style="padding:20px;font:16px system-ui;color:#b3261e">Erreur : '+m+' ('+String(s||"").split("/").pop()+':'+l+')</p>'};window.addEventListener("unhandledrejection",function(e){alert("Erreur : "+(e.reason&&e.reason.message||e.reason))});</script>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
